name: Sync Player Logs

on:
  workflow_dispatch:
    inputs:
      season:
        description: 'Season year (e.g. 2026, 2025-26, 2024-25). Defaults to 2026 if empty.'
        required: false
        default: '2026'
      start_date:
        description: 'Start date (YYYY-MM-DD, optional override)'
        required: false
      end_date:
        description: 'End date (YYYY-MM-DD, optional override)'
        required: false

jobs:
  sync_player_logs:
    runs-on: self-hosted

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Python
        run: |
          echo "Python:"
          python3 --version
          echo "Architecture:"
          uname -m
          echo "Python location:"
          which python3

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pandas sqlalchemy "psycopg[binary]" python-dotenv nba_api

      - name: Compute Execution Parameters
        id: params
        run: |
          START="${{ github.event.inputs.start_date }}"
          END="${{ github.event.inputs.end_date }}"
          SEASON="${{ github.event.inputs.season }}"

          if [ -z "$SEASON" ]; then
            SEASON="2026"
          fi

          echo "start_date=$START" >> "$GITHUB_OUTPUT"
          echo "end_date=$END" >> "$GITHUB_OUTPUT"
          echo "season=$SEASON" >> "$GITHUB_OUTPUT"

          echo "Running with Season: $SEASON, Date Range: '${START:-(full season)}' to '${END:-(full season)}'"

      - name: Sync Player Log (update_playerlog.py)
        working-directory: ./TheOddsGame/ETLService
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          if [ -n "${{ steps.params.outputs.start_date }}" ] && [ -n "${{ steps.params.outputs.end_date }}" ]; then
            python3 update_playerlog.py \
              --season "${{ steps.params.outputs.season }}" \
              --start_date "${{ steps.params.outputs.start_date }}" \
              --end_date "${{ steps.params.outputs.end_date }}"
          elif [ -n "${{ steps.params.outputs.start_date }}" ]; then
            python3 update_playerlog.py \
              --season "${{ steps.params.outputs.season }}" \
              --start_date "${{ steps.params.outputs.start_date }}"
          elif [ -n "${{ steps.params.outputs.end_date }}" ]; then
            python3 update_playerlog.py \
              --season "${{ steps.params.outputs.season }}" \
              --end_date "${{ steps.params.outputs.end_date }}"
          else
            python3 update_playerlog.py \
              --season "${{ steps.params.outputs.season }}"
          fi