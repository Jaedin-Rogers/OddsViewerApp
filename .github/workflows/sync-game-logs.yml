name: Daily NBA Sync (Game Logs)

on:
  schedule:
    # Every day at 4:00 AM Central Time
    - cron: '0 4 * * *'
      timezone: 'America/Chicago'

  workflow_dispatch:
    inputs:
      season:
        description: 'Season year (e.g. 2026, 2025-26, 2024-25). Defaults to 2026 if empty.'
        required: false
        default: '2026'

      start_date:
        description: 'Start date (YYYY-MM-DD, optional override)'
        required: false

      end_date:
        description: 'End date (YYYY-MM-DD, optional override)'
        required: false

jobs:
  sync_nba_data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas sqlalchemy "psycopg[binary]" python-dotenv balldontlie nba_api

      - name: Compute Execution Parameters
        id: params
        run: |
          START="${{ github.event.inputs.start_date }}"
          END="${{ github.event.inputs.end_date }}"
          SEASON="${{ github.event.inputs.season }}"

          # Scheduled runs always use the current 2026 season
          # and sync the last 3 days.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            SEASON="2026"

            TODAY=$(date -u +'%Y-%m-%d')
            START_3D=$(date -u -d "3 days ago" +'%Y-%m-%d')

            START="$START_3D"
            END="$TODAY"
          else
            # Manual runs default to 2026 if season is empty
            if [ -z "$SEASON" ]; then
              SEASON="2026"
            fi
          fi

          # Extract BDL start year
          # Example:
          # 2026    -> 2026
          # 2025-26 -> 2025
          BDL_SEASON=$(echo "$SEASON" | cut -d'-' -f1)

          echo "start_date=$START" >> "$GITHUB_OUTPUT"
          echo "end_date=$END" >> "$GITHUB_OUTPUT"
          echo "season=$SEASON" >> "$GITHUB_OUTPUT"
          echo "bdl_season=$BDL_SEASON" >> "$GITHUB_OUTPUT"

          echo "Running with Season: $SEASON"
          echo "BDL Season: $BDL_SEASON"
          echo "Date Range: '${START:-(full season)}' to '${END:-(full season)}'"

      - name: 1. Sync Game Log (update_gamelog.py)
        working-directory: ./TheOddsGame/ETLService
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}

        run: |
          python update_gamelog.py \
            --seasons "${{ steps.params.outputs.bdl_season }}" \
            --start_date "${{ steps.params.outputs.start_date }}" \
            --end_date "${{ steps.params.outputs.end_date }}"