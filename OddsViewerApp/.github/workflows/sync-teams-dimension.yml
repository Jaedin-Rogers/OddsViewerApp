name: Sync Teams Dime

on:
  schedule:
    - cron: '0 18 * * 5' # Every Friday at 12 PM CST (18:00 UTC)
  workflow_dispatch:
    inputs:
      single:
        description: 'Sync a single team (1) or batch diff update (0)'
        required: false
        default: '0'
        type: choice
        options:
          - '0'
          - '1'
      team_name:
        description: 'Team name (required if single=1), e.g. Thunder'
        required: false
        default: ''
      team_city:
        description: 'Optional team city, e.g. Oklahoma City'
        required: false
        default: ''

jobs:
  sync_teams:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Sync Teams Script
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
        run: |
          ARGS="--process SyncTeams --single ${{ github.event.inputs.single || '0' }}"

          if [ -n "${{ github.event.inputs.team_name }}" ]; then
            ARGS="$ARGS --team_name \"${{ github.event.inputs.team_name }}\""
          fi

          if [ -n "${{ github.event.inputs.team_city }}" ]; then
            ARGS="$ARGS --team_city \"${{ github.event.inputs.team_city }}\""
          fi

          eval python TheOddsGame/ETLService/SyncDim.py $ARGS