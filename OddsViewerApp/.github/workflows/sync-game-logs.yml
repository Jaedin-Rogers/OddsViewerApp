name: Daily NBA Sync (Game & Player Logs)

on:
  schedule:
    # 10:00 UTC is 4:00 AM CST / 5:00 AM CDT (or 09:00 UTC for 4:00 AM CDT)
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Start date (YYYY-MM-DD, optional override)'
        required: false
      end_date:
        description: 'End date (YYYY-MM-DD, optional override)'
        required: false

jobs:
  sync_nba_data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas sqlalchemy "psycopg[binary]" python-dotenv balldontlie nba_api

      - name: Compute Current Date Window
        id: date_calc
        run: |
          # Default to syncing the last 3 days through today to catch stat adjustments
          TODAY=$(date -u +'%Y-%m-%d')
          START_3D=$(date -u -d "3 days ago" +'%Y-%m-%d' 2>/dev/null || date -u -v-3d +'%Y-%m-%d')
          
          START="${{ github.event.inputs.start_date }}"
          END="${{ github.event.inputs.end_date }}"
          
          if [ -z "$START" ]; then START="$START_3D"; fi
          if [ -z "$END" ]; then END="$TODAY"; fi
          
          echo "start_date=$START" >> $GITHUB_OUTPUT
          echo "end_date=$END" >> $GITHUB_OUTPUT
          echo "Syncing window: $START to $END"

      - name: 1. Sync Game Log (update_gamelog.py)
        working-directory: ./TheOddsGame/ETLService
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
        run: |
          python update_gamelog.py \
            --start_date "${{ steps.date_calc.outputs.start_date }}" \
            --end_date "${{ steps.date_calc.outputs.end_date }}"

      - name: 2. Sync Team Log (update_teamlog.py)
        working-directory: ./TheOddsGame/ETLService
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          python update_teamlog.py \
            --start_date "${{ steps.date_calc.outputs.start_date }}" \
            --end_date "${{ steps.date_calc.outputs.end_date }}"

      - name: 3. Sync Player Log (update_playerlog.py)
        working-directory: ./TheOddsGame/ETLService
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          python update_playerlog.py \
            --start_date "${{ steps.date_calc.outputs.start_date }}" \
            --end_date "${{ steps.date_calc.outputs.end_date }}"